# YOLOv3 Training Configuration for Speed Breaker Detection

# Model Configuration
model:
  name: yolov3
  architecture: yolov3.yaml
  pretrained: true

# Training Parameters
epochs: 100
batch_size: 16
img_size: 640
workers: 8

# Data Configuration
data:
  train: data/train/images
  val: data/val/images
  test: data/test/images
  nc: 1  # number of classes
  names: ['speed_breaker']

# Optimization
optimizer:
  name: Adam
  lr: 0.001
  momentum: 0.937
  weight_decay: 0.0005

# Augmentation
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0

# Inference
conf_threshold: 0.25
iou_threshold: 0.45
